name: Build Mobile Application

on:
  push:
    tags:
      - 'mobile-v*'
      - 'v*'
  workflow_dispatch:

concurrency:
  group: build-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Bundle Mobile App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint & Typecheck Mobile
        run: |
          bun run lint:mobile
          bun run typecheck

      - name: Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Export Expo Static Bundle
        env:
          EXPO_PUBLIC_ASSET_URL: https://pub-89b67d288ba046e79e1350d4115fd96b.r2.dev
        run: |
          cd apps/mobile
          bun x expo export --platform web

      - name: Build EAS Binary (Production)
        if: ${{ secrets.EXPO_TOKEN != '' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_ASSET_URL: https://pub-89b67d288ba046e79e1350d4115fd96b.r2.dev
        run: |
          cd apps/mobile
          eas build --platform all --non-interactive --no-wait
