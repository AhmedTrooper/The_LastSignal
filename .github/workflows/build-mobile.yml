name: Build Mobile Application

on:
  push:
    tags:
      - 'mobile-v*'
      - 'v*'
  workflow_dispatch:

concurrency:
  group: build-mobile-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Bundle Mobile App
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint & Typecheck Mobile
        run: |
          bun run lint:mobile
          bun run typecheck

      - name: Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Export Expo Static Bundle
        env:
          EXPO_PUBLIC_ASSET_URL: ${{ secrets.EXPO_PUBLIC_ASSET_URL || vars.EXPO_PUBLIC_ASSET_URL }}
        run: |
          cd apps/mobile
          bun x expo export --platform web

      - name: Archive Mobile Export
        run: |
          cd apps/mobile
          if [ -d "dist" ]; then
            zip -r ../../thelastsignal-mobile-web.zip dist
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-bundle
          path: thelastsignal-mobile-web.zip
          if-no-files-found: ignore

      - name: Build EAS Binary (Production)
        if: env.EXPO_TOKEN != ''
        env:
          EXPO_PUBLIC_ASSET_URL: ${{ secrets.EXPO_PUBLIC_ASSET_URL || vars.EXPO_PUBLIC_ASSET_URL }}
        run: |
          cd apps/mobile
          eas build --platform all --non-interactive --no-wait

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            thelastsignal-mobile-web.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
