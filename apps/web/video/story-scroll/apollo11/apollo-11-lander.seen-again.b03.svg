<title id="title">A small shape, a long shadow</title><desc id="desc">An overhead illustrative site map shows the small octagonal descent stage, its long shadow and scuffed paths. An offset magnifying panel enlarges the stage and four feet. AI-assisted illustration, not a photograph or a to-scale reconstruction.</desc>
