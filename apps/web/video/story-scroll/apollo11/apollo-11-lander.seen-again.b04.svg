<title id="title">Still a story worth finding</title><desc id="desc">A close foreground view of a landing leg and commemorative plaque leads toward the quiet descent stage. A small Earth hangs above the horizon, closing the story on the hardware that stayed. AI-assisted illustration, not a photograph or a to-scale reconstruction.</desc>
