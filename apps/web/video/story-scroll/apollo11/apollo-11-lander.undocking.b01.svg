<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1200" viewBox="0 0 1440 1200" role="img" aria-labelledby="title desc">
  <title id="title">Free of Columbia — Eagle begins its own journey</title>
  <desc id="desc">AI-assisted story illustration, not a mission photograph or a to-scale reconstruction. A large, angular Eagle lunar module with a silver crew cabin, gold descent stage and extended landing legs floats above the curved Moon. Columbia recedes into the upper left. The gap between the spacecraft tells the story of undocking. Based on the Apollo 11 Flight Journal and NASA's mission overview.</desc>
  <metadata>Beat ID: apollo-11-lander.undocking.b01. Historical context: https://apollojournals.org/afj/ap11fj/17day5-undock-doi.html#1001203 . Visual geometry, relative distance, camera position and lighting are artistic interpretations.</metadata>
