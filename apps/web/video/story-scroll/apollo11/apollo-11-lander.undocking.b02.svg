<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1200" viewBox="0 0 1440 1200" role="img" aria-labelledby="title desc">
  <title id="title">A closer look at Eagle's feet — the view from Columbia</title>
  <desc id="desc">AI-assisted illustration, not a photograph. From inside a stylized Columbia window, we look toward the underside of Eagle as it turns for inspection. Four extended landing legs surround a faceted gold descent stage and its dark engine bell. The silver cabin is above it. A pale lunar limb crosses the left side of the window. The foreground window rim makes this a close inspection scene, distinct from the wide separation scene.</desc>
  <metadata>Beat ID: apollo-11-lander.undocking.b02. Context: https://apollojournals.org/afj/ap11fj/17day5-undock-doi.html . Viewpoint, window shape, geometry, lighting and the explanatory turn arc are artistic interpretations, not recorded flight imagery or telemetry.</metadata>
