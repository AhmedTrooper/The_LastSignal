<title id="title">Listening through the ground</title><desc id="desc">A science bay opens like a treasure chest to reveal a compact gold seismic package. A ground cutaway beneath the scene carries a drawn wave, contrasting ground vibration with the silent sky. AI-assisted illustration, not a photograph or a to-scale reconstruction.</desc>
