<title id="title">Four feet, a steady outpost</title><desc id="desc">A low ground-level viewpoint looks up at Eagle settled on its footpads. Settling dust forms broad foreground strokes, and a small cutaway inset explains crushable honeycomb inside the landing strut. AI-assisted illustration, not a photograph or a to-scale reconstruction.</desc>
