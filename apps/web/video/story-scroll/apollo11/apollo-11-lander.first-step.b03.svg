<title id="title">The camera's first window</title><desc id="desc">A camera mounted in the opened equipment bay fills the foreground. Thin view lines point toward the ladder, while a radio-wave motif connects the scene to Earth. AI-assisted illustration, not a photograph or a to-scale reconstruction.</desc>
