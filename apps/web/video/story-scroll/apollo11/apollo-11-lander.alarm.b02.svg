<title id="title">Keep the work that matters</title><desc id="desc">A schematic priority switchboard shows incoming work dividing into a bright route toward guidance and thrusters and a dim route for deferred work. AI-assisted illustration, not a photograph or a to-scale reconstruction.</desc>
