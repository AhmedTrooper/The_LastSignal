<title id="title">The lander becomes a launchpad</title><desc id="desc">Eagle's ascent cabin rises dramatically into the upper left, leaving its golden descent stage low on the surface. A stylized pale engine plume crosses the gap between the stages. AI-assisted illustration, not a photograph or a to-scale reconstruction.</desc>
