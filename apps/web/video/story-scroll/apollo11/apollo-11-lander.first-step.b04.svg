<title id="title">A footprint. A world watching.</title><desc id="desc">A huge boot and fresh tread impression fill the foreground. Behind them, an illustrated television screen carries a small ladder scene, connecting the first step to viewers on Earth. AI-assisted illustration, not a photograph or a to-scale reconstruction.</desc>
