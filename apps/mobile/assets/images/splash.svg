<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
  <defs>
    <!-- Deep Space Background Gradient -->
    <radialGradient id="spaceBg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#241b52" />
      <stop offset="30%" stop-color="#141434" />
      <stop offset="65%" stop-color="#080816" />
      <stop offset="100%" stop-color="#04040a" />
    </radialGradient>

    <!-- Martian Atmospheric Limb Glow -->
    <radialGradient id="marsLimb" cx="90%" cy="92%" r="40%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.3" />
      <stop offset="40%" stop-color="#c2410c" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0" />
    </radialGradient>

    <!-- Lunar Silver Horizon Glow -->
    <radialGradient id="moonLimb" cx="10%" cy="92%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Signal Pulse Glow -->
    <radialGradient id="pulseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="30%" stop-color="#818cf8" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>

    <!-- Golden Antenna Gradient -->
    <linearGradient id="dishGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Transmit Wave Gradient -->
    <linearGradient id="broadcastWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Text Glow Filter -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Cosmos Canvas -->
  <rect width="1080" height="1920" fill="url(#spaceBg)" />

  <!-- Planetary Atmospheric Limbs -->
  <rect width="1080" height="1920" fill="url(#marsLimb)" />
  <rect width="1080" height="1920" fill="url(#moonLimb)" />

  <!-- Constellation Map Grid & Coordinates -->
  <g stroke="#6366f1" stroke-width="1" opacity="0.18">
    <line x1="120" y1="200" x2="960" y2="200" stroke-dasharray="4 8" />
    <line x1="120" y1="600" x2="960" y2="600" stroke-dasharray="4 8" />
    <line x1="120" y1="1400" x2="960" y2="1400" stroke-dasharray="4 8" />
    <line x1="120" y1="1720" x2="960" y2="1720" stroke-dasharray="4 8" />
    <line x1="200" y1="100" x2="200" y2="1820" stroke-dasharray="4 8" />
    <line x1="880" y1="100" x2="880" y2="1820" stroke-dasharray="4 8" />
  </g>

  <!-- Starfield Specks -->
  <g fill="#ffffff">
    <circle cx="140" cy="180" r="1.5" opacity="0.6" />
    <circle cx="280" cy="120" r="2" opacity="0.9" />
    <circle cx="420" cy="190" r="1.2" opacity="0.4" />
    <circle cx="720" cy="140" r="2.5" opacity="0.95" />
    <circle cx="890" cy="220" r="1.5" opacity="0.7" />
    <circle cx="960" cy="110" r="1.8" opacity="0.8" />
    <circle cx="160" cy="380" r="2.2" opacity="0.85" />
    <circle cx="240" cy="480" r="1.5" opacity="0.5" />
    <circle cx="860" cy="420" r="2" opacity="0.8" />
    <circle cx="940" cy="510" r="1.2" opacity="0.6" />
    <circle cx="100" cy="740" r="1.8" opacity="0.7" />
    <circle cx="980" cy="790" r="2.2" opacity="0.85" />
    <circle cx="110" cy="1080" r="1.5" opacity="0.5" />
    <circle cx="970" cy="1140" r="2" opacity="0.75" />
    <circle cx="150" cy="1320" r="1.8" opacity="0.65" />
    <circle cx="930" cy="1360" r="1.5" opacity="0.5" />
    <circle cx="180" cy="1560" r="2.5" opacity="0.9" />
    <circle cx="320" cy="1680" r="1.5" opacity="0.6" />
    <circle cx="760" cy="1620" r="2" opacity="0.8" />
    <circle cx="900" cy="1700" r="1.5" opacity="0.7" />
  </g>

  <!-- Constellation Connectors -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.25">
    <line x1="280" y1="120" x2="160" y2="380" />
    <line x1="160" y1="380" x2="240" y2="480" />
    <line x1="720" y1="140" x2="860" y2="420" />
    <line x1="860" y1="420" x2="940" y2="510" />
  </g>

  <!-- Distant Celestial Trajectory Ring -->
  <ellipse cx="540" cy="980" rx="460" ry="320" fill="none" stroke="#6366f1" stroke-width="1.8" stroke-dasharray="8 12" opacity="0.28" />

  <!-- ========================================================
       CENTRAL MEMORIAL BEACON & DISH ASSEMBLY (Center: 540, 780)
       ======================================================== -->
  <g transform="translate(540, 780)">
    <!-- Expanding Radiating Carrier Waves -->
    <g fill="none" stroke-linecap="round" filter="url(#softGlow)">
      <!-- Tier 4 Outermost Wave -->
      <path d="M -320 -150 A 350 350 0 0 1 320 -150" stroke="url(#broadcastWave)" stroke-width="3" opacity="0.3" />
      <!-- Tier 3 Outer Wave -->
      <path d="M -240 -110 A 260 260 0 0 1 240 -110" stroke="url(#broadcastWave)" stroke-width="5" opacity="0.5" />
      <!-- Tier 2 Mid Wave -->
      <path d="M -160 -70 A 180 180 0 0 1 160 -70" stroke="url(#broadcastWave)" stroke-width="7" opacity="0.8" />
      <!-- Tier 1 Inner Wave -->
      <path d="M -90 -30 A 100 100 0 0 1 90 -30" stroke="#38bdf8" stroke-width="9" opacity="0.95" />
    </g>

    <!-- Beacon Pulse Glow Core -->
    <circle cx="0" cy="0" r="60" fill="url(#pulseGlow)" filter="url(#intenseGlow)" />

    <!-- Parabolic Telemetry Dish Assembly -->
    <g id="mainDish">
      <!-- Outer Dish Rim -->
      <ellipse cx="0" cy="115" rx="150" ry="62" fill="#181436" stroke="url(#dishGold)" stroke-width="12" />
      <!-- Inner Parabolic Bowl Surface -->
      <ellipse cx="0" cy="112" rx="130" ry="48" fill="#291252" opacity="0.85" />
      <ellipse cx="0" cy="108" rx="122" ry="40" fill="none" stroke="#fde047" stroke-width="3.5" opacity="0.9" />

      <!-- Feed Boom Struts -->
      <line x1="-95" y1="125" x2="0" y2="0" stroke="#fef08a" stroke-width="6" stroke-linecap="round" />
      <line x1="95" y1="125" x2="0" y2="0" stroke="#fef08a" stroke-width="6" stroke-linecap="round" />
      <line x1="0" y1="140" x2="0" y2="0" stroke="#d97706" stroke-width="4.5" />

      <!-- Sub-Reflector Feed Horn & Pulse Core -->
      <circle cx="0" cy="0" r="22" fill="#38bdf8" />
      <circle cx="0" cy="0" r="11" fill="#ffffff" />
      <!-- Glint Cross -->
      <line x1="-38" y1="0" x2="38" y2="0" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.95" />
      <line x1="0" y1="-38" x2="0" y2="38" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.95" />

      <!-- Spacecraft Equipment Module -->
      <polygon points="-54,160 54,160 38,225 -38,225" fill="url(#dishGold)" />
      <!-- Solar Array Winglets -->
      <rect x="-105" y="180" width="210" height="18" rx="5" fill="#38bdf8" opacity="0.95" />
      <rect x="-45" y="225" width="90" height="10" rx="3" fill="#d97706" />
      <circle cx="0" cy="245" r="7" fill="#f59e0b" />
      <line x1="0" y1="235" x2="0" y2="245" stroke="#f59e0b" stroke-width="4" />
    </g>
  </g>

  <!-- ========================================================
       MEMORIAL LOGOTYPE & BRANDING (Center: 540, 1240)
       ======================================================== -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Super-title telemetry tag -->
    <rect x="360" y="1120" width="360" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)" stroke-width="1" />
    <circle cx="384" cy="1136" r="4" fill="#38bdf8" />
    <text x="548" y="1141" fill="#38bdf8" font-size="12" font-weight="800" letter-spacing="4">DEEP SPACE MEMORIAL</text>

    <!-- Main Title: ROVERVILLA -->
    <text x="540" y="1220" fill="#ffffff" font-size="46" font-weight="900" letter-spacing="14" filter="url(#textGlow)">ROVERVILLA</text>

    <!-- Accent divider -->
    <line x1="420" y1="1255" x2="660" y2="1255" stroke="#f59e0b" stroke-width="2" opacity="0.8" />
    <circle cx="540" cy="1255" r="4" fill="#fbbf24" />

    <!-- Subtitle -->
    <text x="540" y="1300" fill="rgba(255,255,255,0.72)" font-size="16" font-weight="600" letter-spacing="6">MARS &amp; LUNAR ROBOTIC EXPLORERS</text>

    <!-- Mission Specs Pill -->
    <rect x="290" y="1340" width="500" height="42" rx="21" fill="rgba(99,102,241,0.12)" stroke="rgba(99,102,241,0.3)" stroke-width="1.2" />
    <text x="540" y="1366" fill="#c084fc" font-size="13" font-weight="700" letter-spacing="3">FREQ 8415.5 MHz • S-BAND ARCHIVE</text>
  </g>

  <!-- ========================================================
       FOOTER TELEMETRY CARRIER WAVEFORM (Bottom: 1680)
       ======================================================== -->
  <g transform="translate(190, 1660)">
    <!-- Waveform background track -->
    <rect x="0" y="0" width="700" height="60" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <!-- Live Carrier Wave SVG Path -->
    <path d="M 30 30 
             L 90 30 
             L 110 18 
             L 125 42 
             L 140 22 
             L 155 36 
             L 170 30 
             L 240 30 
             L 260 12 
             L 280 48 
             L 300 15 
             L 320 42 
             L 340 30 
             L 420 30 
             L 435 20 
             L 450 40 
             L 465 24 
             L 480 34 
             L 495 30 
             L 570 30 
             L 590 14 
             L 610 46 
             L 630 18 
             L 645 38 
             L 670 30" 
          fill="none" 
          stroke="#38bdf8" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#softGlow)" />

    <!-- Blip node -->
    <circle cx="280" cy="48" r="4" fill="#ffffff" />
    <circle cx="610" cy="46" r="4" fill="#ffffff" />
  </g>

  <!-- Transmission status line -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="540" y="1770" fill="rgba(255,255,255,0.45)" font-size="12" font-weight="600" letter-spacing="4">
      TRANSMISSION CARRIER LOCKED • NASA / JPL / CNSA / ISRO
    </text>
  </g>
</svg>
