<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Cosmic Gradient -->
    <radialGradient id="spaceGradient" cx="50%" cy="52%" r="72%">
      <stop offset="0%" stop-color="#231a50" />
      <stop offset="35%" stop-color="#121330" />
      <stop offset="70%" stop-color="#080918" />
      <stop offset="100%" stop-color="#04040a" />
    </radialGradient>

    <!-- Signal Pulse Glow -->
    <radialGradient id="signalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="30%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>

    <!-- Golden Antenna Gradient -->
    <linearGradient id="goldDish" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Transmit Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Space Canvas -->
  <rect width="512" height="512" rx="116" fill="url(#spaceGradient)" />

  <!-- Constellation Specks & Distant Stars -->
  <g fill="#ffffff">
    <circle cx="76" cy="116" r="1.5" opacity="0.8" />
    <circle cx="138" cy="74" r="1" opacity="0.5" />
    <circle cx="414" cy="104" r="2" opacity="0.95" />
    <circle cx="448" cy="168" r="1.5" opacity="0.6" />
    <circle cx="92" cy="384" r="1.2" opacity="0.45" />
    <circle cx="432" cy="392" r="1.8" opacity="0.75" />
    <circle cx="212" cy="84" r="1" opacity="0.5" />
    <circle cx="348" cy="62" r="1.5" opacity="0.85" />
    <circle cx="72" cy="240" r="1" opacity="0.4" />
    <circle cx="452" cy="270" r="1.2" opacity="0.55" />
    <circle cx="170" cy="440" r="1" opacity="0.4" />
    <circle cx="330" cy="448" r="1.5" opacity="0.7" />
  </g>

  <!-- Distant Celestial Orbit Arc -->
  <ellipse cx="256" cy="344" rx="214" ry="144" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.32" />

  <!-- Radiating Broadcast Waves (Expanding Upward) -->
  <g fill="none" stroke-linecap="round" filter="url(#softGlow)">
    <!-- Outer Wave -->
    <path d="M 120 140 A 176 176 0 0 1 392 140" stroke="url(#waveGrad)" stroke-width="4.5" opacity="0.45" />
    <!-- Mid Wave -->
    <path d="M 162 176 A 124 124 0 0 1 350 176" stroke="url(#waveGrad)" stroke-width="6.5" opacity="0.75" />
    <!-- Inner Primary Wave -->
    <path d="M 204 212 A 74 74 0 0 1 308 212" stroke="#38bdf8" stroke-width="8.5" opacity="0.95" />
  </g>

  <!-- Beacon Pulse Glow Core -->
  <circle cx="256" cy="235" r="42" fill="url(#signalGlow)" filter="url(#coreGlow)" />

  <!-- Parabolic Dish Receiver / Deep Space Transmitter -->
  <g id="dishAssembly">
    <!-- Dish Back Structure Rim -->
    <ellipse cx="256" cy="308" rx="104" ry="44" fill="#1b153b" stroke="url(#goldDish)" stroke-width="9" />
    <!-- Inner Reflective Surface -->
    <ellipse cx="256" cy="306" rx="90" ry="34" fill="#2a1254" opacity="0.75" />
    <ellipse cx="256" cy="304" rx="84" ry="28" fill="none" stroke="#fde047" stroke-width="2.5" opacity="0.8" />

    <!-- Antenna Sub-Reflector Feed Boom Struts -->
    <line x1="188" y1="318" x2="256" y2="235" stroke="#fef08a" stroke-width="4.5" stroke-linecap="round" />
    <line x1="324" y1="318" x2="256" y2="235" stroke="#fef08a" stroke-width="4.5" stroke-linecap="round" />
    <line x1="256" y1="328" x2="256" y2="235" stroke="#d97706" stroke-width="3.5" />

    <!-- Central Pulsar Transmitter Emitter -->
    <circle cx="256" cy="235" r="15" fill="#38bdf8" />
    <circle cx="256" cy="235" r="7.5" fill="#ffffff" />
    <!-- Light Cross Glint -->
    <line x1="230" y1="235" x2="282" y2="235" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.95" />
    <line x1="256" y1="209" x2="256" y2="261" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.95" />

    <!-- Spacecraft Bus / Pedestal Base -->
    <polygon points="218,340 294,340 282,386 230,386" fill="url(#goldDish)" />
    <!-- Solar Array / Science Boom Winglet -->
    <rect x="182" y="354" width="148" height="13" rx="4" fill="#38bdf8" opacity="0.9" />
    <!-- Low-gain omni antenna / probe mast -->
    <rect x="224" y="386" width="64" height="8" rx="2" fill="#d97706" />
    <circle cx="256" cy="402" r="5" fill="#f59e0b" />
    <line x1="256" y1="394" x2="256" y2="402" stroke="#f59e0b" stroke-width="3" />
  </g>
</svg>
