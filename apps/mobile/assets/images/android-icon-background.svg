<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Cosmic Gradient -->
    <radialGradient id="bgCosmic" cx="50%" cy="52%" r="72%">
      <stop offset="0%" stop-color="#231a50" />
      <stop offset="35%" stop-color="#121330" />
      <stop offset="70%" stop-color="#080918" />
      <stop offset="100%" stop-color="#04040a" />
