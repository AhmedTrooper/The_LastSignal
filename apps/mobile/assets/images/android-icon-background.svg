    <circle cx="138" cy="74" r="1" opacity="0.5" />
    <circle cx="414" cy="104" r="2" opacity="0.95" />
    <circle cx="448" cy="168" r="1.5" opacity="0.6" />
    <circle cx="92" cy="384" r="1.2" opacity="0.45" />
    <circle cx="432" cy="392" r="1.8" opacity="0.75" />
    <circle cx="212" cy="84" r="1" opacity="0.5" />
    <circle cx="348" cy="62" r="1.5" opacity="0.85" />
    <circle cx="72" cy="240" r="1" opacity="0.4" />
    <circle cx="452" cy="270" r="1.2" opacity="0.55" />
    <circle cx="170" cy="440" r="1" opacity="0.4" />
    <circle cx="330" cy="448" r="1.5" opacity="0.7" />
