<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Centered monochrome silhouette inside the 66% Adaptive Icon Safe Zone -->
  <g transform="translate(256, 262) scale(0.72)" fill="#ffffff" stroke="#ffffff">
    <!-- Radiating Broadcast Waves (Expanding Upward) -->
    <g fill="none" stroke-linecap="round">
      <path d="M -180 -120 A 180 180 0 0 1 180 -120" stroke-width="6" opacity="0.4" />
      <path d="M -130 -80 A 130 130 0 0 1 130 -80" stroke-width="8" opacity="0.75" />
      <path d="M -75 -40 A 75 75 0 0 1 75 -40" stroke-width="10" opacity="1" />
    </g>

    <!-- Beacon Pulse Glow Core -->
    <circle cx="0" cy="0" r="18" stroke="none" fill="#ffffff" />
    <line x1="-30" y1="0" x2="30" y2="0" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="-30" x2="0" y2="30" stroke-width="3" stroke-linecap="round" />

    <!-- Parabolic Dish Receiver / Deep Space Transmitter -->
    <g id="monoDish">
      <!-- Dish Rim -->
      <ellipse cx="0" cy="95" rx="112" ry="46" fill="none" stroke-width="10" />
      <!-- Inner Bowl Surface -->
      <ellipse cx="0" cy="93" rx="90" ry="30" fill="none" stroke-width="3" opacity="0.8" />

      <!-- Antenna Sub-Reflector Feed Boom Struts -->
      <line x1="-72" y1="105" x2="0" y2="0" stroke-width="5" stroke-linecap="round" />
      <line x1="72" y1="105" x2="0" y2="0" stroke-width="5" stroke-linecap="round" />
      <line x1="0" y1="115" x2="0" y2="0" stroke-width="4" />

      <!-- Spacecraft Bus / Pedestal Base -->
      <polygon points="-40,128 40,128 28,175 -28,175" stroke="none" fill="#ffffff" />
      <!-- Solar Array Winglet -->
      <rect x="-80" y="142" width="160" height="14" rx="4" stroke="none" fill="#ffffff" opacity="0.9" />
      <rect x="-35" y="175" width="70" height="9" rx="2" stroke="none" fill="#ffffff" />
      <circle cx="0" cy="192" r="6" stroke="none" fill="#ffffff" />
      <line x1="0" y1="184" x2="0" y2="192" stroke-width="3" />
    </g>
  </g>
</svg>
